<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RH Tech IA - Pipeline Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 2px solid #334155;
            padding: 20px 0;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        header .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .connection-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        .connection-status.connected {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid #22c55e;
        }

        .connection-status.disconnected {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .connection-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .connected .dot { background: #22c55e; }
        .disconnected .dot { background: #ef4444; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .phases {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .phase {
            flex: 1;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid;
            transition: all 0.3s ease;
        }

        .phase.INICIO {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
        }

        .phase.MEIO {
            background: rgba(234, 179, 8, 0.1);
            border-color: #eab308;
        }

        .phase.FIM {
            background: rgba(34, 197, 94, 0.1);
            border-color: #22c55e;
        }

        .phase.active {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        .phase-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .phase.INICIO .phase-header { color: #ef4444; }
        .phase.MEIO .phase-header { color: #eab308; }
        .phase.FIM .phase-header { color: #22c55e; }

        .checks {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .check {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .check-icon {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        .check-name {
            flex: 1;
            font-size: 0.9rem;
        }

        .check-status {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 500;
        }

        .check-status.pending {
            background: #334155;
            color: #94a3b8;
        }

        .check-status.running {
            background: rgba(234, 179, 8, 0.3);
            color: #eab308;
        }

        .check-status.success {
            background: rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }

        .check-status.warning {
            background: rgba(234, 179, 8, 0.3);
            color: #eab308;
        }

        .check-status.failed {
            background: rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .check-status.skipped {
            background: #334155;
            color: #64748b;
        }

        .check-duration {
            font-size: 0.75rem;
            color: #64748b;
        }

        .logs-section {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            overflow: hidden;
        }

        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
        }

        .logs-header h2 {
            font-size: 1rem;
        }

        .logs-filters {
            display: flex;
            gap: 10px;
        }

        .logs-filters select {
            padding: 6px 12px;
            background: #334155;
            border: none;
            border-radius: 6px;
            color: #f1f5f9;
            font-size: 0.85rem;
        }

        .logs-list {
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.8rem;
        }

        .log-entry {
            padding: 6px 10px;
            border-radius: 4px;
            margin-bottom: 4px;
            display: flex;
            gap: 10px;
        }

        .log-entry.debug { background: rgba(100, 116, 139, 0.2); color: #94a3b8; }
        .log-entry.info { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .log-entry.notice { background: rgba(6, 182, 212, 0.2); color: #22d3ee; }
        .log-entry.warning { background: rgba(234, 179, 8, 0.2); color: #facc15; }
        .log-entry.error { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .log-entry.critical { background: rgba(239, 68, 68, 0.4); color: #fca5a5; }

        .log-time {
            color: #64748b;
            white-space: nowrap;
        }

        .log-level {
            font-weight: 600;
            text-transform: uppercase;
            width: 60px;
        }

        .log-message {
            flex: 1;
            word-break: break-word;
        }

        .summary {
            margin-top: 30px;
            padding: 20px;
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .summary-item {
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }

        .summary-item .value {
            font-size: 2rem;
            font-weight: 700;
        }

        .summary-item.success .value { color: #22c55e; }
        .summary-item.warning .value { color: #eab308; }
        .summary-item.failed .value { color: #ef4444; }
        .summary-item.skipped .value { color: #64748b; }

        .summary-item .label {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 5px;
        }

        .final-status {
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .final-status.success {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 2px solid #22c55e;
        }

        .final-status.failed {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 2px solid #ef4444;
        }

        .final-status.running {
            background: rgba(234, 179, 8, 0.2);
            color: #eab308;
            border: 2px solid #eab308;
        }

        .progress-bar {
            height: 4px;
            background: #334155;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-bar .fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        .progress-bar .fill.running { background: #eab308; }
        .progress-bar .fill.success { background: #22c55e; }
        .progress-bar .fill.failed { background: #ef4444; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🔍 RH Tech IA - Pipeline Monitor</h1>
            <p class="subtitle">Monitoramento em tempo real do pipeline de CI/CD</p>
            <div id="connectionStatus" class="connection-status disconnected">
                <span class="dot"></span>
                <span class="text">Desconectado</span>
            </div>
            <div class="progress-bar">
                <div id="progressFill" class="fill" style="width: 0%"></div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="phases">
            <div class="phase INICIO" id="phaseINICIO">
                <div class="phase-header">
                    <span>🔴</span>
                    <span>FASE 1: SEGURANÇA</span>
                </div>
                <div class="checks" id="checksINICIO"></div>
            </div>

            <div class="phase MEIO" id="phaseMEIO">
                <div class="phase-header">
                    <span>🟡</span>
                    <span>FASE 2: VALIDAÇÃO</span>
                </div>
                <div class="checks" id="checksMEIO"></div>
            </div>

            <div class="phase FIM" id="phaseFIM">
                <div class="phase-header">
                    <span>🟢</span>
                    <span>FASE 3: DEPLOY</span>
                </div>
                <div class="checks" id="checksFIM"></div>
            </div>
        </div>

        <div class="logs-section">
            <div class="logs-header">
                <h2>📋 Logs em Tempo Real</h2>
                <div class="logs-filters">
                    <select id="levelFilter" onchange="filterLogs()">
                        <option value="all">Todos</option>
                        <option value="debug">Debug</option>
                        <option value="info">Info</option>
                        <option value="warning">Warning</option>
                        <option value="error">Error</option>
                    </select>
                </div>
            </div>
            <div class="logs-list" id="logsList"></div>
        </div>

        <div class="summary">
            <div class="summary-grid">
                <div class="summary-item success">
                    <div class="value" id="successCount">0</div>
                    <div class="label">Sucesso</div>
                </div>
                <div class="summary-item warning">
                    <div class="value" id="warningCount">0</div>
                    <div class="label">Avisos</div>
                </div>
                <div class="summary-item failed">
                    <div class="value" id="failedCount">0</div>
                    <div class="label">Falhas</div>
                </div>
                <div class="summary-item skipped">
                    <div class="value" id="skippedCount">0</div>
                    <div class="label">Pulados</div>
                </div>
            </div>
            <div id="finalStatus" class="final-status running">
                ⏳ Pipeline em execução...
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api/v1';
        const SSE_URL = `${API_BASE}/logs/stream`;

        let checks = {
            INICIO: [],
            MEIO: [],
            FIM: []
        };
        let logs = [];
        let eventSource = null;
        let isConnected = false;

        const CHECKS_CONFIG = {
            INICIO: ['Secret Scan', 'Gitleaks', 'Pre-commit Hook'],
            MEIO: ['PHP Syntax', 'PHPUnit', 'Pint Linter', 'ESLint', 'TypeScript', 'Composer Audit', 'NPM Audit'],
            FIM: ['Docker Build', 'Push Registry', 'Deploy', 'Health Check']
        };

        function initChecks() {
            Object.keys(CHECKS_CONFIG).forEach(phase => {
                checks[phase] = CHECKS_CONFIG[phase].map(name => ({
                    name,
                    status: 'pending',
                    duration: 0
                }));
                renderChecks(phase);
            });
        }

        function renderChecks(phase) {
            const container = document.getElementById(`checks${phase}`);
            container.innerHTML = checks[phase].map((check, idx) => `
                <div class="check">
                    <span class="check-icon">${getStatusIcon(check.status)}</span>
                    <span class="check-name">${check.name}</span>
                    <span class="check-status ${check.status}">${check.status.toUpperCase()}</span>
                    ${check.duration > 0 ? `<span class="check-duration">${check.duration.toFixed(1)}s</span>` : ''}
                </div>
            `).join('');
        }

        function getStatusIcon(status) {
            const icons = {
                pending: '⬜',
                running: '🟨',
                success: '🟩',
                warning: '🟨',
                failed: '🟥',
                skipped: '⊘'
            };
            return icons[status] || '⬜';
        }

        function updateCheck(phase, stepName, status, duration = 0) {
            const phaseChecks = checks[phase];
            const check = phaseChecks.find(c => c.name === stepName);
            if (check) {
                check.status = status;
                check.duration = duration;
            }
            renderChecks(phase);
            updateSummary();
            updateProgress();
        }

        function updatePhaseStatus(phase, isActive) {
            const phaseEl = document.getElementById(`phase${phase}`);
            if (isActive) {
                phaseEl.classList.add('active');
            } else {
                phaseEl.classList.remove('active');
            }
        }

        function addLog(level, message) {
            const time = new Date().toLocaleTimeString('pt-BR');
            logs.unshift({ time, level, message });
            if (logs.length > 200) logs.pop();
            renderLogs();
        }

        function renderLogs() {
            const filter = document.getElementById('levelFilter').value;
            const filtered = filter === 'all' ? logs : logs.filter(l => l.level === filter);

            const container = document.getElementById('logsList');
            container.innerHTML = filtered.slice(0, 100).map(log => `
                <div class="log-entry ${log.level}">
                    <span class="log-time">${log.time}</span>
                    <span class="log-level">${log.level}</span>
                    <span class="log-message">${escapeHtml(log.message)}</span>
                </div>
            `).join('');
        }

        function filterLogs() {
            renderLogs();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateSummary() {
            let success = 0, warning = 0, failed = 0, skipped = 0;

            Object.values(checks).forEach(phaseChecks => {
                phaseChecks.forEach(check => {
                    switch(check.status) {
                        case 'success': success++; break;
                        case 'warning': warning++; break;
                        case 'failed': failed++; break;
                        case 'skipped': skipped++; break;
                    }
                });
            });

            document.getElementById('successCount').textContent = success;
            document.getElementById('warningCount').textContent = warning;
            document.getElementById('failedCount').textContent = failed;
            document.getElementById('skippedCount').textContent = skipped;
        }

        function updateProgress() {
            let total = 0, completed = 0;

            Object.values(checks).forEach(phaseChecks => {
                phaseChecks.forEach(check => {
                    total++;
                    if (check.status !== 'pending' && check.status !== 'running') {
                        completed++;
                    }
                });
            });

            const percent = total > 0 ? (completed / total) * 100 : 0;
            const fill = document.getElementById('progressFill');

            let status = 'running';
            if (failed > 0) status = 'failed';
            else if (completed === total) status = 'success';

            fill.style.width = `${percent}%`;
            fill.className = `fill ${status}`;

            const finalStatus = document.getElementById('finalStatus');
            if (status === 'success') {
                finalStatus.className = 'final-status success';
                finalStatus.textContent = '✅ PIPELINE CONCLUÍDO COM SUCESSO';
            } else if (status === 'failed') {
                finalStatus.className = 'final-status failed';
                finalStatus.textContent = '❌ PIPELINE FALHOU';
            } else {
                finalStatus.className = 'final-status running';
                finalStatus.textContent = `⏳ Pipeline em execução... ${percent.toFixed(0)}%`;
            }
        }

        function setConnectionStatus(connected) {
            isConnected = connected;
            const statusEl = document.getElementById('connectionStatus');
            if (connected) {
                statusEl.className = 'connection-status connected';
                statusEl.querySelector('.text').textContent = 'Conectado';
            } else {
                statusEl.className = 'connection-status disconnected';
                statusEl.querySelector('.text').textContent = 'Desconectado';
            }
        }

        function connect() {
            const token = localStorage.getItem('auth_token') || 'demo-token';

            eventSource = new EventSource(`${SSE_URL}?channel=development`, {
                withCredentials: true
            });

            eventSource.onopen = () => {
                setConnectionStatus(true);
                addLog('info', 'Conectado ao stream de logs');
            };

            eventSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    if (data.type === 'logs' && Array.isArray(data.logs)) {
                        data.logs.forEach(log => {
                            addLog(log.level || 'info', log.message);
                        });
                    } else if (data.type === 'pipeline') {
                        handlePipelineStatus(data);
                    }
                } catch (e) {
                    console.error('Erro ao processar mensagem:', e);
                }
            };

            eventSource.onerror = () => {
                setConnectionStatus(false);
                addLog('error', 'Conexão perdida. Tentando reconectar...');
                setTimeout(connect, 3000);
            };
        }

        function handlePipelineStatus(data) {
            const { status, phase, step, message, details } = data;

            const phaseName = phase || 'INICIO';

            if (status === 'running' || status === 'started') {
                updatePhaseStatus(phaseName, true);
                updateCheck(phaseName, step, 'running');
                if (message) addLog('info', message);
            } else if (status === 'success') {
                updateCheck(phaseName, step, 'success', details?.duration || 0);
                if (message) addLog('info', message);
            } else if (status === 'warning') {
                updateCheck(phaseName, step, 'warning', details?.duration || 0);
                if (message) addLog('warning', message);
            } else if (status === 'failed') {
                updateCheck(phaseName, step, 'failed', details?.duration || 0);
                if (message) addLog('error', message);
            } else if (status === 'completed') {
                updateSummary();
                updateProgress();
                addLog('info', 'Pipeline concluído');
            }
        }

        initChecks();
        connect();
    </script>
</body>
</html>
