# ===========================================
# Observability Stack - Docker Compose
# ===========================================
# Uso: docker-compose -f docker-compose.observability.yml up -d

version: '3.8'

services:
  # ===========================================
  # Jaeger - Distributed Tracing
  # ===========================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: rhtechia-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "14250:14250"   # Collector
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
    networks:
      - observability

  # ===========================================
  # Prometheus - Metrics
  # ===========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: rhtechia-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - observability

  # ===========================================
  # Grafana - Dashboards
  # ===========================================
  grafana:
    image: grafana/grafana:latest
    container_name: rhtechia-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
    networks:
      - observability

  # ===========================================
  # Loki - Logs (Optional)
  # ===========================================
  loki:
    image: grafana/loki:latest
    container_name: rhtechia-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    networks:
      - observability

# ===========================================
# NETWORKS
# ===========================================
networks:
  observability:
    driver: bridge

# ===========================================
# VOLUMES
# ===========================================
volumes:
  prometheus-data:
  grafana-data:
  loki-data:
