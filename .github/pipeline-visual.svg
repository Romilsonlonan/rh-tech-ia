<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-yellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#0F172A"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="24" font-weight="bold">RH Tech IA - Pipeline CI/CD</text>

  <!-- ==================== FASE 1: INICIO (VERMELHO) ==================== -->
  <g id="fase-inicio">
    <!-- Box container -->
    <rect x="50" y="70" width="1100" height="200" rx="10" fill="#1E1E1E" stroke="#DC2626" stroke-width="3"/>

    <!-- Title -->
    <text x="600" y="100" text-anchor="middle" fill="#DC2626" font-family="Arial, sans-serif" font-size="18" font-weight="bold">🔴 FASE 1: INÍCIO - SEGURANÇA</text>

    <!-- Step 1: Secret Scan -->
    <rect x="100" y="130" width="200" height="100" rx="8" fill="#DC2626" filter="url(#shadow)"/>
    <text x="200" y="165" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">SECRET SCAN</text>
    <text x="200" y="185" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">grep patterns</text>
    <text x="200" y="215" text-anchor="middle" fill="#FCA5A5" font-family="Arial, sans-serif" font-size="9">🔴 BLOQUEAR</text>

    <!-- Arrow 1->2 -->
    <line x1="300" y1="180" x2="380" y2="180" stroke="#DC2626" stroke-width="3" marker-end="url(#arrow-red)"/>

    <!-- Step 2: Gitleaks -->
    <rect x="390" y="130" width="200" height="100" rx="8" fill="#DC2626" filter="url(#shadow)"/>
    <text x="490" y="165" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">GITLEAKS</text>
    <text x="490" y="185" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">detect secrets</text>
    <text x="490" y="215" text-anchor="middle" fill="#FCA5A5" font-family="Arial, sans-serif" font-size="9">🔴 BLOQUEAR</text>

    <!-- Arrow 2->3 -->
    <line x1="590" y1="180" x2="670" y2="180" stroke="#DC2626" stroke-width="3" marker-end="url(#arrow-red)"/>

    <!-- Step 3: Pre-commit -->
    <rect x="680" y="130" width="200" height="100" rx="8" fill="#DC2626" filter="url(#shadow)"/>
    <text x="780" y="165" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">PRE-COMMIT</text>
    <text x="780" y="185" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">hooks</text>
    <text x="780" y="215" text-anchor="middle" fill="#FCA5A5" font-family="Arial, sans-serif" font-size="9">🔴 BLOQUEAR</text>

    <!-- Failure indicator -->
    <rect x="900" y="130" width="220" height="100" rx="8" fill="#450A0A" stroke="#DC2626" stroke-width="2"/>
    <text x="1010" y="165" text-anchor="middle" fill="#FCA5A5" font-family="Arial, sans-serif" font-size="12" font-weight="bold">❌ SE FALHAR</text>
    <text x="1010" y="185" text-anchor="middle" fill="#FCA5A5" font-family="Arial, sans-serif" font-size="9">AKIA*, sk-*, ghp_*,</text>
    <text x="1010" y="200" text-anchor="middle" fill="#FCA5A5" font-family="Arial, sans-serif" font-size="9">PRIVATE KEY</text>
    <text x="1010" y="220" text-anchor="middle" fill="#DC2626" font-family="Arial, sans-serif" font-size="11" font-weight="bold">BLOQUEAR COMMIT</text>

    <!-- Arrow to fase 2 -->
    <line x1="600" y1="270" x2="600" y2="310" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrow-yellow)"/>
  </g>

  <!-- ==================== FASE 2: MEIO (AMARELO) ==================== -->
  <g id="fase-meio">
    <!-- Box container -->
    <rect x="50" y="320" width="1100" height="260" rx="10" fill="#1E1E1E" stroke="#F59E0B" stroke-width="3"/>

    <!-- Title -->
    <text x="600" y="350" text-anchor="middle" fill="#F59E0B" font-family="Arial, sans-serif" font-size="18" font-weight="bold">🟡 FASE 2: MEIO - VALIDAÇÃO E TESTES</text>

    <!-- BACKEND Section -->
    <text x="200" y="380" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="14" font-weight="bold">BACKEND (Laravel)</text>

    <!-- Step 1: Composer -->
    <rect x="70" y="395" width="130" height="80" rx="8" fill="#F59E0B" filter="url(#shadow)"/>
    <text x="135" y="425" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">COMPOSER</text>
    <text x="135" y="440" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">install</text>
    <text x="135" y="460" text-anchor="middle" fill="#FEF3C7" font-family="Arial, sans-serif" font-size="8">🟡 AVISO</text>

    <!-- Arrow -->
    <line x1="200" y1="435" x2="240" y2="435" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-yellow)"/>

    <!-- Step 2: Pint -->
    <rect x="250" y="395" width="130" height="80" rx="8" fill="#F59E0B" filter="url(#shadow)"/>
    <text x="315" y="425" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">PINT</text>
    <text x="315" y="440" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">--test</text>
    <text x="315" y="460" text-anchor="middle" fill="#FEF3C7" font-family="Arial, sans-serif" font-size="8">🟡 AVISO</text>

    <!-- Arrow -->
    <line x1="380" y1="435" x2="420" y2="435" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-yellow)"/>

    <!-- Step 3: PHPUnit -->
    <rect x="430" y="395" width="130" height="80" rx="8" fill="#F59E0B" filter="url(#shadow)"/>
    <text x="495" y="425" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">PHPUNIT</text>
    <text x="495" y="440" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">tests</text>
    <text x="495" y="460" text-anchor="middle" fill="#FEF3C7" font-family="Arial, sans-serif" font-size="8">🟡 AVISO</text>

    <!-- FRONTEND Section -->
    <text x="800" y="380" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="14" font-weight="bold">FRONTEND (React)</text>

    <!-- Step 1: NPM -->
    <rect x="670" y="395" width="130" height="80" rx="8" fill="#F59E0B" filter="url(#shadow)"/>
    <text x="735" y="425" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">NPM</text>
    <text x="735" y="440" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">install</text>
    <text x="735" y="460" text-anchor="middle" fill="#FEF3C7" font-family="Arial, sans-serif" font-size="8">🟡 AVISO</text>

    <!-- Arrow -->
    <line x1="800" y1="435" x2="840" y2="435" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-yellow)"/>

    <!-- Step 2: ESLint -->
    <rect x="850" y="395" width="130" height="80" rx="8" fill="#F59E0B" filter="url(#shadow)"/>
    <text x="915" y="425" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">ESLINT</text>
    <text x="915" y="440" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">lint</text>
    <text x="915" y="460" text-anchor="middle" fill="#FEF3C7" font-family="Arial, sans-serif" font-size="8">🟡 AVISO</text>

    <!-- Arrow -->
    <line x1="980" y1="435" x2="1020" y2="435" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-yellow)"/>

    <!-- Step 3: TypeScript -->
    <rect x="1030" y="395" width="130" height="80" rx="8" fill="#F59E0B" filter="url(#shadow)"/>
    <text x="1095" y="425" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">TYPESCRIPT</text>
    <text x="1095" y="440" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">check</text>
    <text x="1095" y="460" text-anchor="middle" fill="#FEF3C7" font-family="Arial, sans-serif" font-size="8">🟡 AVISO</text>

    <!-- Bottom row: Audit and Build -->
    <!-- Backend Audit -->
    <rect x="130" y="490" width="130" height="70" rx="8" fill="#F59E0B" filter="url(#shadow)"/>
    <text x="195" y="515" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">AUDIT</text>
    <text x="195" y="530" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">composer audit</text>
    <text x="195" y="550" text-anchor="middle" fill="#FEF3C7" font-family="Arial, sans-serif" font-size="8">🟡 AVISO</text>

    <!-- Arrow -->
    <line x1="260" y1="525" x2="300" y2="525" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-yellow)"/>

    <!-- Backend Migrate -->
    <rect x="310" y="490" width="130" height="70" rx="8" fill="#F59E0B" filter="url(#shadow)"/>
    <text x="375" y="515" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">MIGRATE</text>
    <text x="375" y="530" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">migrate --force</text>
    <text x="375" y="550" text-anchor="middle" fill="#FEF3C7" font-family="Arial, sans-serif" font-size="8">🟡 AVISO</text>

    <!-- Frontend Vitest -->
    <rect x="720" y="490" width="130" height="70" rx="8" fill="#F59E0B" filter="url(#shadow)"/>
    <text x="785" y="515" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">VITEST</text>
    <text x="785" y="530" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">test</text>
    <text x="785" y="550" text-anchor="middle" fill="#FEF3C7" font-family="Arial, sans-serif" font-size="8">🟡 AVISO</text>

    <!-- Arrow -->
    <line x1="850" y1="525" x2="890" y2="525" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-yellow)"/>

    <!-- Frontend Build -->
    <rect x="900" y="490" width="130" height="70" rx="8" fill="#F59E0B" filter="url(#shadow)"/>
    <text x="965" y="515" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">BUILD</text>
    <text x="965" y="530" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">vite build</text>
    <text x="965" y="550" text-anchor="middle" fill="#FEF3C7" font-family="Arial, sans-serif" font-size="8">🟡 AVISO</text>

    <!-- Failure/Success indicators -->
    <rect x="490" y="490" width="180" height="70" rx="8" fill="#422006" stroke="#F59E0B" stroke-width="2"/>
    <text x="580" y="515" text-anchor="middle" fill="#FEF3C7" font-family="Arial, sans-serif" font-size="10" font-weight="bold">⚠️ SE AVISO</text>
    <text x="580" y="530" text-anchor="middle" fill="#FEF3C7" font-family="Arial, sans-serif" font-size="9">REPORTAR MAS</text>
    <text x="580" y="545" text-anchor="middle" fill="#FEF3C7" font-family="Arial, sans-serif" font-size="9">CONTINUAR</text>

    <rect x="490" y="570" width="180" height="30" rx="6" fill="#450A0A" stroke="#DC2626" stroke-width="1"/>
    <text x="580" y="590" text-anchor="middle" fill="#DC2626" font-family="Arial, sans-serif" font-size="9" font-weight="bold">❌ SE ERRO = FALHAR BUILD</text>

    <!-- Arrow to fase 3 -->
    <line x1="600" y1="580" x2="600" y2="620" stroke="#10B981" stroke-width="3" marker-end="url(#arrow-green)"/>
  </g>

  <!-- ==================== FASE 3: FIM (VERDE) ==================== -->
  <g id="fase-fim">
    <!-- Box container -->
    <rect x="50" y="630" width="1100" height="150" rx="10" fill="#1E1E1E" stroke="#10B981" stroke-width="3"/>

    <!-- Title -->
    <text x="600" y="660" text-anchor="middle" fill="#10B981" font-family="Arial, sans-serif" font-size="18" font-weight="bold">🟢 FASE 3: FIM - DEPLOY</text>

    <!-- Step 1: Docker Build -->
    <rect x="80" y="685" width="160" height="70" rx="8" fill="#10B981" filter="url(#shadow)"/>
    <text x="160" y="710" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">DOCKER BUILD</text>
    <text x="160" y="728" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">docker build</text>
    <text x="160" y="745" text-anchor="middle" fill="#A7F3D0" font-family="Arial, sans-serif" font-size="8">🟢 SUCESSO</text>

    <!-- Arrow -->
    <line x1="240" y1="720" x2="280" y2="720" stroke="#10B981" stroke-width="3" marker-end="url(#arrow-green)"/>

    <!-- Step 2: Push Registry -->
    <rect x="290" y="685" width="160" height="70" rx="8" fill="#10B981" filter="url(#shadow)"/>
    <text x="370" y="710" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">PUSH REGISTRY</text>
    <text x="370" y="728" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">ghcr.io</text>
    <text x="370" y="745" text-anchor="middle" fill="#A7F3D0" font-family="Arial, sans-serif" font-size="8">🟢 SUCESSO</text>

    <!-- Arrow -->
    <line x1="450" y1="720" x2="490" y2="720" stroke="#10B981" stroke-width="3" marker-end="url(#arrow-green)"/>

    <!-- Step 3: Deploy Server -->
    <rect x="500" y="685" width="160" height="70" rx="8" fill="#10B981" filter="url(#shadow)"/>
    <text x="580" y="710" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">DEPLOY</text>
    <text x="580" y="728" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">ssh-action</text>
    <text x="580" y="745" text-anchor="middle" fill="#A7F3D0" font-family="Arial, sans-serif" font-size="8">🟢 SUCESSO</text>

    <!-- Arrow -->
    <line x1="660" y1="720" x2="700" y2="720" stroke="#10B981" stroke-width="3" marker-end="url(#arrow-green)"/>

    <!-- Step 4: Health Check -->
    <rect x="710" y="685" width="160" height="70" rx="8" fill="#10B981" filter="url(#shadow)"/>
    <text x="790" y="710" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">HEALTH CHECK</text>
    <text x="790" y="728" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">/health</text>
    <text x="790" y="745" text-anchor="middle" fill="#A7F3D0" font-family="Arial, sans-serif" font-size="8">🟢 SUCESSO</text>

    <!-- Arrow -->
    <line x1="870" y1="720" x2="910" y2="720" stroke="#10B981" stroke-width="3" marker-end="url(#arrow-green)"/>

    <!-- Step 5: Done -->
    <rect x="920" y="685" width="160" height="70" rx="8" fill="#10B981" filter="url(#shadow)"/>
    <text x="1000" y="710" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">✅ DONE</text>
    <text x="1000" y="728" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">APP NO AR</text>
    <text x="1000" y="745" text-anchor="middle" fill="#A7F3D0" font-family="Arial, sans-serif" font-size="8">🚀 PRODUÇÃO</text>
  </g>

  <!-- Legend -->
  <g id="legend" transform="translate(50, 30)">
    <rect x="850" y="0" width="300" height="35" rx="6" fill="#1E1E1E" stroke="#475569" stroke-width="1"/>
    <circle cx="880" cy="17" r="8" fill="#DC2626"/>
    <text x="895" y="21" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="10">INÍCIO</text>
    <circle cx="950" cy="17" r="8" fill="#F59E0B"/>
    <text x="965" y="21" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="10">MEIO</text>
    <circle cx="1020" cy="17" r="8" fill="#10B981"/>
    <text x="1035" y="21" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="10">FIM</text>
  </g>
</svg>
