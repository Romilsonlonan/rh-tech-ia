name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '20'

jobs:
  security:
    name: 🔴 Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammath/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pgsql, pcntl, bcmath, gd, zip

      - name: 🔍 Secret Scan
        run: |
          echo "🔴 [1/3] Secret Scan..."
          if grep -rE "(sk-|AKIA|ghp_|glpat-|xox[baprs])" --include="*.php" --include="*.js" --include="*.ts" --include="*.env" -l . 2>/dev/null | grep -v vendor | grep -v node_modules | head -5; then
            echo "❌ FALHOU: Secrets detected"
            exit 1
          fi
          echo "🟩 Secret Scan - OK"

      - name: 🔍 Gitleaks Check
        run: |
          echo "🔴 [2/3] Gitleaks..."
          if command -v gitleaks &>/dev/null; then
            gitleaks detect --source . --no-color 2>&1 || exit 1
          else
            echo "⚠️  Gitleaks not installed, skipping"
          fi
          echo "🟩 Gitleaks - OK"

      - name: 🔍 Pre-commit Hook
        run: |
          echo "🔴 [3/3] Pre-commit Hook..."
          chmod +x .githooks/pre-commit
          .githooks/pre-commit
          echo "🟩 Pre-commit - OK"

      - name: 🟡 Frontend Security Audit
        run: |
          echo "🟡 [4/6] Frontend Audit..."
          cd frontend
          npm ci
          npm audit --audit-level=high
          echo "🟩 Frontend Audit - OK"

      - name: 🟡 Backend Security Audit
        run: |
          echo "🟡 [5/6] Backend Audit..."
          cd backend
          composer update --no-interaction
          composer audit --no-interaction
          echo "🟩 Backend Audit - OK"

      - name: 🟡 PHP Syntax
        run: |
          echo "🟡 [6/6] PHP Syntax..."
          find backend/app -name "*.php" -exec php -l {} \; 2>&1 | grep -v "No syntax errors" || true
          echo "🟩 PHP Syntax - OK"

  backend:
    name: 🟡 Backend (Laravel)
    runs-on: ubuntu-latest
    needs: security

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rhtechia_test
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammath/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pgsql, pcntl, bcmath, gd, zip
          coverage: none

      - name: Get Composer Cache
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: 🟡 Install Backend Dependencies
        run: composer update --no-interaction --prefer-dist
        working-directory: backend

      - name: 🟡 Pint (Linter)
        run: |
          echo "🟡 Running Pint..."
          ./vendor/bin/pint --test
          echo "🟩 Pint - OK"

      - name: 🟡 Run PHPUnit Tests
        run: |
          echo "🟡 Running PHPUnit..."
          php artisan migrate --force
          ./vendor/bin/phpunit --no-coverage
          echo "🟩 PHPUnit - OK"
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: rhtechia_test
          DB_USERNAME: runner
          DB_PASSWORD: secret

  frontend:
    name: 🟡 Frontend (React)
    runs-on: ubuntu-latest
    needs: security

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get npm Dependencies Cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-

      - name: 🟡 Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: 🟡 Run ESLint
        run: |
          echo "🟡 Running ESLint..."
          npm run lint
          echo "🟩 ESLint - OK"
        working-directory: frontend

      - name: 🟡 Run TypeScript Check
        run: |
          echo "🟡 Running TypeScript..."
          npm run typecheck
          echo "🟩 TypeScript - OK"
        working-directory: frontend

      - name: 🟡 Run Tests
        run: |
          echo "🟡 Running Tests..."
          npm run test
          echo "🟩 Tests - OK"
        working-directory: frontend

      - name: 🟢 Build Production
        run: |
          echo "🟢 Building..."
          npm run build
          echo "🟩 Build - OK"
        working-directory: frontend

  deploy:
    name: 🟢 Deploy to Production
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: 🟢 Build Docker Images
        run: |
          echo "🟢 Building Docker images..."
          docker compose build
          echo "🟩 Docker Build - OK"

      - name: 🟢 Push to Registry
        run: |
          echo "🟢 Pushing to registry..."
          echo "🟩 Push - OK"

      - name: 🟢 Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "🟢 Deploying to server..."
            cd /var/www/rhtechia
            git pull origin main
            cd backend && composer install --no-interaction --optimize-autoloader
            php artisan migrate --force
            cd ../frontend && npm install && npm run build
            sudo systemctl reload php-fpm
            echo "🟩 Deploy - OK"
        continue-on-error: true
