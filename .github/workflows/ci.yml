name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rhtechia_test
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammath/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pgsql, pcntl, gd, zip
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          working-directory: backend

      - name: Get Composer Cache
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install Backend Dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Run Pint (Linter)
        working-directory: backend
        run: ./vendor/bin/pint --test

      - name: Run PHPUnit Tests
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: rhtechia_test
          DB_USERNAME: runner
          DB_PASSWORD: secret
        run: |
          php artisan migrate --force
          ./vendor/bin/phpunit --coverage-text

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: laravel
        continue-on-error: true

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          working-directory: frontend

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript Check
        working-directory: frontend
        run: npm run typecheck

      - name: Run Tests
        working-directory: frontend
        run: npm run test -- --coverage

      - name: Build Production
        working-directory: frontend
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7

  deploy:
    name: Deploy to Production
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/rhtechia
            git pull origin main
            cd backend && composer install --no-interaction --optimize-autoloader
            php artisan migrate --force
            cd ../frontend && npm install && npm run build
            sudo systemctl reload php-fpm
        continue-on-error: true
