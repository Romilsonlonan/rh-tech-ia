name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '20'

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammath/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pgsql, pcntl, bcmath, gd, zip

      - name: Frontend Security Audit
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=high

      - name: Backend Security Audit
        run: |
          cd backend
          composer update --no-interaction
          composer audit --no-interaction

  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    needs: security

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rhtechia_test
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammath/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pgsql, pcntl, bcmath, gd, zip
          coverage: none

      - name: Get Composer Cache
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install Backend Dependencies
        run: composer update --no-interaction --prefer-dist
        working-directory: backend

      - name: Run Pint (Linter)
        run: ./vendor/bin/pint --test
        working-directory: backend

      - name: Run PHPUnit Tests
        run: |
          php artisan migrate --force
          ./vendor/bin/phpunit --no-coverage
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: rhtechia_test
          DB_USERNAME: runner
          DB_PASSWORD: secret

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    needs: security

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get npm Dependencies Cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

      - name: Run TypeScript Check
        run: npm run typecheck
        working-directory: frontend

      - name: Run Tests
        run: npm run test
        working-directory: frontend

      - name: Build Production
        run: npm run build
        working-directory: frontend

  deploy:
    name: Deploy to Production
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/rhtechia
            git pull origin main
            cd backend && composer install --no-interaction --optimize-autoloader
            php artisan migrate --force
            cd ../frontend && npm install && npm run build
            sudo systemctl reload php-fpm
        continue-on-error: true
