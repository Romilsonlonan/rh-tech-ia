services:
  # =====================================================
  # BACKEND - Laravel Application
  # =====================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rhtechia-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/var/www/html/storage
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=rhtechia
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres123
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - FILESYSTEM_DISK=s3
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=rhtechia
      - AWS_URL=http://minio:9000
      - AWS_ENDPOINT=http://minio:9000
      - AWS_USE_PATH_STYLE_ENDPOINT=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - rhtechia-network

  # =====================================================
  # FRONTEND - React Application  
  # =====================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rhtechia-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_APP_ENV=development
    depends_on:
      - backend
    networks:
      - rhtechia-network

  # =====================================================
  # NGINX - Reverse Proxy
  # =====================================================
  nginx:
    image: nginx:alpine
    container_name: rhtechia-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - backend-data:/var/www/html/storage
    depends_on:
      - backend
      - frontend
    networks:
      - rhtechia-network

  # =====================================================
  # DATABASE - PostgreSQL
  # =====================================================
  postgres:
    image: postgres:16-alpine
    container_name: rhtechia-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=rhtechia
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rhtechia-network

  # =====================================================
  # REDIS - Cache & Queue
  # =====================================================
  redis:
    image: redis:7-alpine
    container_name: rhtechia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - rhtechia-network

  # =====================================================
  # MINIO - S3-Compatible Storage
  # =====================================================
  minio:
    image: minio/minio:latest
    container_name: rhtechia-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rhtechia-network

  # =====================================================
  # CREATE BUCKETS - Initialize MinIO
  # =====================================================
  minio-init:
    image: minio/mc:latest
    container_name: rhtechia-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/rhtechia --ignore-existing;
      mc anonymous set public myminio/rhtechia;
      exit 0;
      "
    networks:
      - rhtechia-network

# =====================================================
# NETWORKS
# =====================================================
networks:
  rhtechia-network:
    driver: bridge

# =====================================================
# VOLUMES
# =====================================================
volumes:
  postgres-data:
  redis-data:
  minio-data:
  backend-data:
